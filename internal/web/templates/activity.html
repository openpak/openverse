{{define "page"}}{{template "head" .}}
<div class="page-head">
  <h1>{{t "nav.activity"}}</h1>
  <p class="lede">{{t "activity.lede"}}</p>
</div>
<div class="seg-row">
<nav class="seg" aria-label="{{t "nav.activity"}}">
  <a href="/activity" {{if eq .Data.Scope "everyone"}}aria-current="page"{{end}}>{{t "feed.everyone"}}</a>
  <a href="/activity?scope=following" {{if eq .Data.Scope "following"}}aria-current="page"{{end}}>{{t "feed.following"}}</a>
</nav>
<a class="btn" href="/settings#activity">{{template "icon" "gear"}}{{t "activity.share"}}</a>
</div>
{{template "activity-list" .Data}}
{{template "pager" .Data.Pager}}
{{template "foot" .}}{{end}}
