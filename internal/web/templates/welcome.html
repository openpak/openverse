{{define "page"}}{{template "head" .}}
<div class="narrow">
<div class="page-head">
  <p class="eyebrow">{{tf "welcome.hi" .Data.Name}}</p>
  <h1>{{t "welcome.title"}}</h1>
  <p class="lede">{{th "welcome.lede" (printf "%s/terms" .OpenPak)}}</p>
</div>
<section class="card welcome-card">
  <ul class="rules">
    <li>{{t "welcome.r1"}}</li>
    <li>{{t "welcome.r2"}}</li>
    <li>{{t "welcome.r3"}}</li>
    <li>{{t "welcome.r4"}}</li>
    <li>{{t "welcome.r5"}}</li>
  </ul>
  <div class="btn-row">
    <form method="post" action="/welcome"><input type="hidden" name="next" value="{{.Data.Next}}"><button type="submit" class="btn primary">{{t "welcome.accept"}}</button></form>
    <form method="get" action="/auth/logout"><button type="submit" class="btn">{{t "welcome.decline"}}</button></form>
  </div>
</section>
</div>
{{template "foot" .}}{{end}}
